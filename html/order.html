   <main id="top" class="order-page">
    <img class="order-flower"
     src="../images/order-magnolia.png"
     alt="">
    <h1>Заказать букет</h1>
    <p>Заполните форму, чтобы оформить заказ.</p>
    <p><a href="#order-form">К форме заказа</a></p>
    <form id="order-form"
      class="order-form"
      action="https://httpbin.org/get"
      method="get"
      target="_blank">
    <label>
        Ваше имя:
        <input type="text" name="customer-name">
    </label>

    <label>
        Количество букетов:
        <input type="number" name="bouquet-count" min="1" value="1">
    </label>

    <label>
        <input type="checkbox" name="card">
        Добавить открытку
    </label>

    <label>
        Дата доставки:
        <input type="date" name="delivery-date">
    </label>

    <label>
    Пароль для редактирования заказа:
    <input type="password" name="order-password">
</label>

    <input type="hidden" name="source" value="website">

    <p>Способ получения:</p>

    <label>
        <input type="radio" name="delivery-type" value="delivery">
        Доставка
    </label>

    <label>
        <input type="radio" name="delivery-type" value="pickup">
        Самовывоз
    </label>
<button type="submit">Отправить заказ</button>
</form>
<p><a href="#top">К началу</a></p>
</main>
</body>
</html>
